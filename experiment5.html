<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiemnt-5</title>
</head>
<body>
    <form action="./submit.html">
        <center><h1>Student Registration Form</h1></center>
        <hr>
        <label for="name">Full Name:</label>
        <input type="text" name="name" id="name" placeholder="Enter Your full Name" min="5" max="15" required>
        <br><br>
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" placeholder="Enter valid email address" required>
        <br><br>
        <label for="pass">Password:</label>
        <input type="password" name="pass" id="pass" placeholder="Enter Password" required>
        <br><br>
        <label for="gender">Gender:</label>
        <input type="radio" name="gender" id="gender"><label for="gender">Male</label>
        <input type="radio" name="gender" id="gender"><label for="gender">Female</label>
        <input type="radio" name="gender" id="gender"><label for="gender">Other</label>
        <br><br>
        <label for="course">Course:</label>
        <select name="course" id="course">
            <option value="">Select Course</option>
            <option value="C++ with DSA">C++</option>
            <option value="HTML">HTML</option>
            <option value="Java">Java</option>
            <option value="Python">Python</option>
        </select>
        <br><br>
        <label for="phone">Contact No.:</label>
        <input type="tel" name="phone" id="phone" placeholder="Enter Phone Number" required>
        <br><br>
        <label for="address">Address:</label>
        <br>
        <textarea name="Address" id="address" placeholder="Enter your address"></textarea>
        <br><br>
        <input type="submit" value="Register">
        &nbsp;
        <input type="reset" value="Clear">
        <hr>
    </form>
    <center><footer>&copy;Student Registration Portal</footer></center>
    
</body>
</html>

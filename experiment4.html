<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXPERIMENT NO.-4</title>
</head>

<body>
    <form action="./response.html">
        <fieldset>
            <center>
                <h1>Hotel Room Booking Form </h1>

                <label for="Name">Full Name:</label>
                <input type="text" id="Name" placeholder="Enter your full name">
                <br>
                <br>
                <label for="Email">Email:</label>
                <input type="email" id="Email" placeholder="Enter your email">
                <br>
                <br>
                <label for="Phone">Phone:</label>
                <input type="tel" id="Phone" placeholder="Enter your phone no.">
                <br>
                <br>
                <label for="Check in">Check-in Date:</label>
                <input type="date" id="Check in" placeholder="Enter your check-in date">
                <br>
                <br>
                <label for="Check out">Check-out Date:</label>
                <input type="date" id="Check out" placeholder="Enter your check out date" required>
                <br><br>
                <label for="room type">Room Type:</label>
                <select id="room type">
                    <option value="">select</option>
                    <option value="Single">Single Room</option>
                    <option value="Double">Double Room</option>
                    <option value="Suite">Suite</option>
                </select>
                <br><br>
                <label for="No. of guests">Number of Guests:</label>
                <input type="number" id="No. of guests" placeholder="No. of guests">
                <br><br>
                <label for="Special requests">Special Requests:</label>
                <br>
                <textarea id="Special requests" placeholder="Enter any special requests"></textarea>
                <br><br>
                <input type="submit" value="Book Now">
                &nbsp;
                <input type="reset" value="Reset form">
            </center>

        </fieldset>
    </form>
</body>

</html>
